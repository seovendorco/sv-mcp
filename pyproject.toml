[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "sv-mcp"
version = "0.1.0"
description = "MCP server exposing SV's content/SEO tools to AI agents, built on top of sv-cli."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "sv-cli>=0.3.0",
  "fastmcp>=3.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
]

[project.scripts]
sv-mcp = "sv_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sv_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
